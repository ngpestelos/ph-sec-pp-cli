# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "ph-sec-pp-cli"
display_name = "Philippines SEC"
description = "Free SEC Number status by registration number — local cache, honest limits. Not name search. Not GIS. Requires PH_SEC_TOKEN."
project_kind = "cli"

[secrets.file]
path = "~/.config/ph-sec-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
PH_SEC_TOKEN = true
